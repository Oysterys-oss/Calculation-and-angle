<div class="coordinate-container">
    <h3>請輸入座標資料：</h3>
    
    <!-- 表格區域 -->
    <div class="table-wrapper">
        <table id="coordTable">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>點號 (Point ID)</th>
                    <th>X 座標</th>
                    <th>Y 座標</th>
                    <th style="width: 60px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 預設顯示幾行空白列供使用者輸入 -->
                <tr>
                    <td class="row-index">1</td>
                    <td><input type="text" class="input-id" placeholder="例: GU04"></td>
                    <td><input type="number" step="any" class="input-x" placeholder="例: 2764649.9410"></td>
                    <td><input type="number" step="any" class="input-y" placeholder="例: 308235.9495"></td>
                    <td><button type="button" class="btn-delete" onclick="deleteRow(this)">刪除</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 按鈕操作區 -->
    <div class="button-group">
        <button type="button" id="addRowBtn" class="btn-secondary">新增一行</button>
        <button type="button" id="calculateBtn" class="btn-primary">開始計算導線</button>
    </div>
</div>
