<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网页版 Excel</title>
    
    <!-- 引入 Luckysheet 依赖样式和脚本 -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/Plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
    
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #luckysheet {
            margin: 0px;
            padding: 0px;
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0px;
            top: 0px;
        }
    </style>
</head>
<body>

    <!-- 网页版 Excel 容器 -->
    <div id="luckysheet"></div>

    <script>
        // 页面加载完成后初始化表格
        window.onload = function () {
            luckysheet.create({
                container: 'luckysheet', // 容器 ID
                title: '我的在线表格',     // 表格名称
                lang: 'zh',              // 语言设为中文
                data: [
                    {
                        name: "Sheet1", // 工作表名字
                        color: "",
                        status: "1",
                        order: "0",
                        data: [
                            // 这里可以自定义初始表格数据（行、列、单元格内容）
                            [
                                {v: "项目", m: "项目", bg: "#d9d9d9", ct: {fa: "@", t: "s"}},
                                {v: "数量", m: "数量", bg: "#d9d9d9", ct: {fa: "@", t: "s"}},
                                {v: "价格", m: "价格", bg: "#d9d9d9", ct: {fa: "@", t: "s"}}
                            ],
                            [
                                {v: "苹果", m: "苹果"}, {v: 10, m: "10"}, {v: 5, m: "5"}
                            ],
                            [
                                {v: "香蕉", m: "香蕉"}, {v: 20, m: "20"}, {v: 3, m: "3"}
                            ]
                        ]
                    }
                ]
            });
        }
    </script>
</body>
</html>
