<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測量方位角與距離計算工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background: #3498db; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .result { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #2ecc71; border-radius: 4px; }
        .result p { margin: 8px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>測量方位角與距離計算</h2>
    
    <div class="input-group">
        <label>起點座標 (E, N 或 X, Y):</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="x1" placeholder="起點 E (X)" step="any">
            <input type="number" id="y1" placeholder="起點 N (Y)" step="any">
        </div>
    </div>

    <div class="input-group">
        <label>終點座標 (E, N 或 X, Y):</label>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="x2" placeholder="終點 E (X)" step="any">
            <input type="number" id="y2" placeholder="終點 N (Y)" step="any">
        </div>
    </div>

    <button onclick="calculate()">計算</button>

    <div class="result" id="resultArea" style="display: none;">
        <h3>計算結果</h3>
        <p><strong>水平距離 (Distance):</strong> <span id="resDist"></span> 公尺</p>
        <p><strong>方位角 (十進位):</strong> <span id="resAzDeg"></span>°</p>
        <p><strong>方位角 (度分秒 DMS):</strong> <span id="resAzDMS"></span></p>
    </div>
</div>

<script>
function degToDMS(deg) {
    let d = Math.floor(deg);
    let mFloat = (deg - d) * 60;
    let m = Math.floor(mFloat);
    let s = ((mFloat - m) * 60).toFixed(2);
    return `${d}° ${m}' ${s}"`;
}

function calculate() {
    let x1 = parseFloat(document.getElementById('x1').value);
    let y1 = parseFloat(document.getElementById('y1').value);
    let x2 = parseFloat(document.getElementById('x2').value);
    let y2 = parseFloat(document.getElementById('y2').value);

    if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
        alert("請輸入完整的有效座標數值！");
        return;
    }

    let dx = x2 - x1;
    let dy = y2 - y1;

    // 計算距離
    let distance = Math.sqrt(dx * dx + dy * dy);

    // 計算方位角 (JavaScript 的 Math.atan2(dx, dy) 配合測量學 Y軸為基準)
    let angleRad = Math.atan2(dx, dy);
    let angleDeg = angleRad * (180 / Math.PI);

    // 轉為 0 ~ 360 度
    if (angleDeg < 0) {
        angleDeg += 360;
    }

    // 顯示結果
    document.getElementById('resDist').innerText = distance.toFixed(3);
    document.getElementById('resAzDeg').innerText = angleDeg.toFixed(4);
    document.getElementById('resAzDMS').innerText = degToDMS(angleDeg);
    document.getElementById('resultArea').style.display = 'block';
}
</script>

</body>
</html>
