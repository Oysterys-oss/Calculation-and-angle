<body>

    <div id="header">
        <span class="title">📐 測量內業計算與校驗系統 (網頁版)</span>
        <button class="calc-btn" onclick="runCalcMultiplePoints()">⚡ 執行計算點位座標</button>
    </div>
    
    <div id="luckysheet"></div>

    <script>
        const PI = 3.14159265358979;

        function AzimuthByAtn(dN, dE) {
            let angleRad = 0;
            if (dE > 0) {
                angleRad = Math.atan(dE / dN);
            } else if (dE < 0 && dN >= 0) {
                angleRad = Math.atan(dE / dN) + PI;
            } else if (dE < 0 && dN < 0) {
                angleRad = Math.atan(dE / dN) - PI;
            } else if (dE === 0 && dN > 0) {
                angleRad = PI / 2;
            } else if (dE === 0 && dN < 0) {
                angleRad = -PI / 2;
            } else {
                angleRad = 0;
            }
            let az = angleRad * 180 / PI;
            if (az < 0) az += 360;
            return az;
        }

        function NormalizeAzimuth(az) {
            let norm = az - Math.floor(az / 360) * 360;
            if (norm < 0) norm += 360;
            return norm;
        }

        function DMS_to_Decimal(deg, min, sec) {
            return deg + min / 60.0 + sec / 3600.0;
        }

        function runCalcMultiplePoints() {
            try {
                let getData = luckysheet.flowdata();
                
                let nA = parseFloat(getData[2][1]?.v);
                let eA = parseFloat(getData[2][2]?.v);
                let nB = parseFloat(getData[3][1]?.v);
                let eB = parseFloat(getData[3][2]?.v);

                if (isNaN(nA) || isNaN(eA) || isNaN(nB) || isNaN(eB)) {
                    alert("請先確認 A 點 (第3行) 與 B 點 (第4行) 的原始座標是否正確填入！");
                    return;
                }

                let azPrev = AzimuthByAtn(nB - nA, eB - eA);
                let nCurr = nB;
                let eCurr = eB;

                // 從第 4 列開始迴圈 (對應 Excel 第 5 行起)
                for (let i = 4; i < getData.length - 1; i++) {
                    let row = getData[i];
                    if (!row) continue;

                    let sideLen = parseFloat(row[3]?.v); // 實測平距 (D欄)
                    let degVal = parseFloat(row[4]?.v);  // 度 (E欄)
                    let minVal = parseFloat(row[5]?.v);  // 分 (F欄)
                    let secVal = parseFloat(row[6]?.v);  // 秒 (G欄)

                    if (isNaN(sideLen)) continue;

                    let incDeg = DMS_to_Decimal(isNaN(degVal)?0:degVal, isNaN(minVal)?0:minVal, isNaN(secVal)?0:secVal);
                    let radAzNext = NormalizeAzimuth(azPrev - 180 + incDeg) * PI / 180.0;

                    let nNext = nCurr + sideLen * Math.cos(radAzNext);
                    let eNext = eCurr + sideLen * Math.sin(radAzNext);
                    let azNextDeg = NormalizeAzimuth(radAzNext * 180 / PI);

                    // 確保數值以完整的小數點 4 位寫入 H 欄(7) 與 I 欄(8)
                    luckysheet.setCellValue(i, 7, nNext.toFixed(4));
                    luckysheet.setCellValue(i, 8, eNext.toFixed(4));
                    
                    nCurr = nNext;
                    eCurr = eNext;
                    azPrev = azNextDeg;
                }

                alert("多點座標推算完成！");
            } catch (err) {
                console.error(err);
                alert("計算發生錯誤，請檢查輸入數據格式。");
            }
        }
