/* =========================================================
   已知線段

/* =========================================================
   點號選項
========================================================= */

function pointOptions(selected=""){

    let html='<option value="">-- 選擇 --</option>';

    knownPoints.forEach(p=>{

        const selectedText =
            p.id===selected ? "selected" : "";

        html+=`
            <option value="${escapeHtml(p.id)}" ${selectedText}>
                ${escapeHtml(p.id)}
            </option>
        `;

    });

    return html;
}


function updatePointSelects(){

    const ids=[
        "backPoint",
        "startPoint",
        "endPoint",
        "forePoint"
    ];

    ids.forEach(id=>{

        const select=document.getElementById(id);

        if(!select) return;

        const old=select.value;

        select.innerHTML=pointOptions(old);

    });

    renderKnownLines();

}


/* =========================================================
   DMS
========================================================= */

function dmsToDecimal(value){

    if(value===null || value===undefined) return NaN;

    let s=String(value).trim();

    if(!s) return NaN;

    /* 純數字 */

    if(
        !s.includes("°") &&
        !s.includes("'") &&
        !s.includes("′") &&
        !s.includes('"') &&
        !s.includes("″")
    ){

        const n=Number(s);

        if(!Number.isNaN(n)){

            /*
             123.4530
             → 123°45'30"
            */

            if(n>360) return NaN;

            return n;
        }

    }

    const nums=s.match(/[-+]?\d+(?:\.\d+)?/g);

    if(!nums) return NaN;

    let d=parseFloat(nums[0]) || 0;
    let m=parseFloat(nums[1]) || 0;
    let sec=parseFloat(nums[2]) || 0;

    let sign=d<0 ? -1 : 1;

    d=Math.abs(d);

    return sign*(d+m/60+sec/3600);

}


function decimalToDMS(value){

    if(!Number.isFinite(value)) return "";

    value=((value%360)+360)%360;

    let d=Math.floor(value);

    let mf=(value-d)*60;

    let m=Math.floor(mf);

    let s=(mf-m)*60;

    return `${d}°${String(m).padStart(2,"0")}'${s.toFixed(2).padStart(5,"0")}"`;

}


/* =========================================================
   已知線段計算
========================================================= */

function getLineDN(line){

    const az=dmsToDecimal(line.azimuth);

    const dis=parseFloat(line.distance);

    if(!Number.isFinite(az) || !Number.isFinite(dis))
        return "";

    return (dis*Math.cos(az*Math.PI/180)).toFixed(4);

}


function getLineDE(line){

    const az=dmsToDecimal(line.azimuth);

    const dis=parseFloat(line.distance);

    if(!Number.isFinite(az) || !Number.isFinite(dis))
        return "";

    return (dis*Math.sin(az*Math.PI/180)).toFixed(4);

}


function updateLineResult(i){

    const dn=document.getElementById(`dn_${i}`);
    const de=document.getElementById(`de_${i}`);

    if(dn) dn.textContent=getLineDN(knownLines[i]);
    if(de) de.textContent=getLineDE(knownLines[i]);

}


/* =========================================================
   Excel 匯入
========================================================= */

function importExcel(event){

    const file=event.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

        try{

            const data=new Uint8Array(e.target.result);

            const workbook=
                XLSX.read(data,{type:"array"});

            const sheetName=
                workbook.SheetNames[0];

            const sheet=
                workbook.Sheets[sheetName];

            const rows=
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval:""
                    }
                );

            if(!rows.length){

                alert("Excel 沒有資料。");
                return;

            }

            let pointCount=0;
            let lineCount=0;

            rows.forEach(row=>{

                const normalized={};

                Object.keys(row).forEach(k=>{

                    normalized[
                        String(k)
                            .trim()
                            .replace(/\s/g,"")
                    ]=row[k];

                });


                /* 已知點 */

                const id=
                    normalized["點號"] ??
                    normalized["點名"] ??
                    normalized["ID"] ??
                    normalized["Point"] ??
                    "";

                const n=
                    normalized["N座標"] ??
                    normalized["N"] ??
                    normalized["Northing"] ??
                    normalized["北坐標"] ??
                    "";

                const ee=
                    normalized["E座標"] ??
                    normalized["E"] ??
                    normalized["Easting"] ??
                    normalized["東坐標"] ??
                    "";


                if(
                    String(id).trim() &&
                    n!=="" &&
                    ee!==""
                ){

                    knownPoints.push({

                        id:String(id),
                        n:n,
                        e:ee,
                        note:
                            normalized["備註"] ??
                            normalized["Note"] ??
                            ""

                    });

                    pointCount++;

                }


                /* 已知線段 */

                const start=
                    normalized["起點"] ??
                    normalized["起點號"] ??
                    normalized["Start"] ??
                    "";

                const end=
                    normalized["終點"] ??
                    normalized["終點號"] ??
                    normalized["End"] ??
                    "";

                const az=
                    normalized["方位角"] ??
                    normalized["Azimuth"] ??
                    "";

                const distance=
                    normalized["距離"] ??
                    normalized["距離(m)"] ??
                    normalized["Distance"] ??
                    "";


                if(
                    String(start).trim() &&
                    String(end).trim() &&
                    az!==""
                ){

                    knownLines.push({

                        start:String(start),
                        end:String(end),
                        azimuth:az,
                        distance:distance,
                        note:
                            normalized["備註"] ??
                            normalized["Note"] ??
                            ""

                    });

                    lineCount++;

                }

            });


            renderKnownPoints();
            updatePointSelects();
            renderKnownLines();

            alert(
                `Excel 匯入完成！\n\n`+
                `已知點：${pointCount} 筆\n`+
                `已知線段：${lineCount} 筆`
            );

        }
        catch(err){

            console.error(err);

            alert(
                "Excel 匯入失敗：\n"+
                err.message
            );

        }

    };

    reader.readAsArrayBuffer(file);

    event.target.value="";

}


/* =========================================================
   Excel 匯出
========================================================= */

function exportExcel(){

    const wb=XLSX.utils.book_new();


    /* 已知點 */

    const points=knownPoints.map((p,i)=>({

        編號:i+1,

        點號:p.id,

        N座標:p.n,

        E座標:p.e,

        備註:p.note

    }));


    const ws1=
        XLSX.utils.json_to_sheet(points);

    XLSX.utils.book_append_sheet(
        wb,
        ws1,
        "已知點座標"
    );


    /* 已知線段 */

    const lines=knownLines.map((l,i)=>({

        編號:i+1,

        起點:l.start,

        終點:l.end,

        方位角:l.azimuth,

        距離:l.distance,

        ΔN:getLineDN(l),

        ΔE:getLineDE(l),

        備註:l.note

    }));


    const ws2=
        XLSX.utils.json_to_sheet(lines);

    XLSX.utils.book_append_sheet(
        wb,
        ws2,
        "已知線段"
    );


    XLSX.writeFile(
        wb,
        "導線測量_已知座標與線段.xlsx"
    );

}

/* =========================================================
   計算
========================================================= */

function calculate(){

    const result=[];

    knownPoints.forEach(p=>{

        result.push({

            id:p.id,

            n:Number(p.n),

            e:Number(p.e),

            azimuth:"",

            distance:"",

            dn:"",

            de:""

        });

    });


    /*
      將已知線段加入計算結果
    */

    knownLines.forEach(line=>{

        const start=
            knownPoints.find(
                p=>p.id===line.start
            );

        if(!start) return;

        const az=
            dmsToDecimal(line.azimuth);

        const dis=
            Number(line.distance);

        if(
            !Number.isFinite(az) ||
            !Number.isFinite(dis)
        ) return;

        const dn=
            dis*Math.cos(
                az*Math.PI/180
            );

        const de=
            dis*Math.sin(
                az*Math.PI/180
            );

        const n=
            Number(start.n)+dn;

        const e=
            Number(start.e)+de;

        result.push({

            id:line.end,

            n:n,

            e:e,

            azimuth:decimalToDMS(az),

            distance:dis,

            dn:dn,

            de:de

        });

    });


    renderResult(result);

    drawPlan(result);

    document.getElementById("resultMessage").innerHTML=
        `計算完成：${result.length} 筆座標資料。`;

}


function renderResult(result){

    const body=
        document.getElementById("resultTableBody");

    body.innerHTML="";

    result.forEach(r=>{

        const tr=document.createElement("tr");

        tr.innerHTML=`

            <td>${escapeHtml(r.id)}</td>

            <td>${formatNumber(r.n)}</td>

            <td>${formatNumber(r.e)}</td>

            <td>${r.azimuth || ""}</td>

            <td>${formatNumber(r.distance)}</td>

            <td>${formatNumber(r.dn)}</td>

            <td>${formatNumber(r.de)}</td>

        `;

        body.appendChild(tr);

    });

}


/* =========================================================
   平面圖
========================================================= */

function drawPlan(points){

    const canvas=
        document.getElementById("planCanvas");

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!points.length) return;


    const valid=
        points.filter(
            p=>Number.isFinite(p.n) &&
               Number.isFinite(p.e)
        );

    if(!valid.length) return;


    let minN=Math.min(...valid.map(p=>p.n));
    let maxN=Math.max(...valid.map(p=>p.n));

    let minE=Math.min(...valid.map(p=>p.e));
    let maxE=Math.max(...valid.map(p=>p.e));


    const pad=60;

    const w=
        canvas.width-pad*2;

    const h=
        canvas.height-pad*2;


    const rangeN=
        Math.max(maxN-minN,1);

    const rangeE=
        Math.max(maxE-minE,1);


    function x(e){

        return pad+
            (e-minE)/rangeE*w;

    }


    function y(n){

        return canvas.height-pad-
            (n-minN)/rangeN*h;

    }


    /* 座標軸 */

    ctx.strokeStyle="#94a3b8";

    ctx.beginPath();

    ctx.moveTo(pad,canvas.height-pad);
    ctx.lineTo(canvas.width-pad,canvas.height-pad);

    ctx.moveTo(pad,pad);
    ctx.lineTo(pad,canvas.height-pad);

    ctx.stroke();


    /* 線段 */

    knownLines.forEach(line=>{

        const p1=
            valid.find(
                p=>p.id===line.start
            );

        const p2=
            valid.find(
                p=>p.id===line.end
            );

        if(!p1 || !p2) return;

        ctx.strokeStyle="#7c3aed";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            x(p1.e),
            y(p1.n)
        );

        ctx.lineTo(
            x(p2.e),
            y(p2.n)
        );

        ctx.stroke();

    });


    /* 點 */

    valid.forEach(p=>{

        const px=x(p.e);
        const py=y(p.n);


        ctx.fillStyle="#2563eb";

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#111827";

        ctx.font="13px Microsoft JhengHei";

        ctx.fillText(
            p.id,
            px+8,
            py-8
        );

    });

}


/* =========================================================
   工具
========================================================= */

function formatNumber(value){

    if(value==="" || value===null || value===undefined)
        return "";

    const n=Number(value);

    if(!Number.isFinite(n))
        return value;

    return n.toFixed(4);

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
