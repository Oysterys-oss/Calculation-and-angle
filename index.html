<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多站連續導線座標計算與管理工具</title>
    <!-- 引入 SheetJS 用於前端匯入與匯出 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .section-box {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .section-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .section-box h3 .toggle-icon {
            font-size: 0.9rem;
            color: #64748b;
            transition: transform 0.2s;
        }

        .collapsible-content {
            display: none; /* 預設收合 */
            margin-top: 10px;
        }

        .hint-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        th {
            background-color: #e2e8f0;
            font-weight: 600;
        }

        .angle-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .angle-inputs input {
            text-align: center;
            padding: 6px 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary-color); color: white; flex: 2; }
        .btn-success { background-color: var(--success-color); color: white; flex: 1.5; }
        .btn-info { background-color: #0284c7; color: white; flex: 1.5; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-color); flex: 1; }
        .btn-danger-outline { background-color: #fff; color: var(--danger-color); border: 1px solid var(--danger-color); flex: 1; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 6px 12px; font-size: 0.85rem; }

        .known-tag {
            font-size: 0.8rem;
            color: #16a34a;
            background: #dcfce7;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>多站連續導線座標計算與管理工具</h1>

    <!-- 匯入按鈕 -->
    <div class="section-box" style="background-color: #eff6ff; border-color: #bfdbfe;">
        <h3 style="color: #1d4ed8; margin-top: 0;">📂 匯入標準檢測成果表 Excel</h3>
        <div class="hint-text">點擊匯入後，程式會自動掃描標題列進行精準欄位對應（小數點後4位、秒、差值2位）。</div>
        <input type="file" id="reportFileImporter" accept=".xlsx, .xls, .csv" style="display: none;">
        <button type="button" id="importReportBtn" class="btn-info">📂 選擇並匯入控制點檢測成果表</button>
    </div>

    <!-- 起始後視點與設站點 -->
    <div class="section-box">
        <h3>📍 起始導線起算點與第一站實測資料 (第 1 站)</h3>
        <div class="grid-2" style="margin-top: 10px;">
            <div class="form-group">
                <label>初始後視點 點號 (BS):</label>
                <input type="text" id="bsId" value="" placeholder="例: Y251">
            </div>
            <div class="form-group">
                <label>初始設站點 點號 (ST):</label>
                <input type="text" id="stId" value="" placeholder="例: Y250">
            </div>
            <div class="form-group">
                <label>後視點 縱座標 (N):</label>
                <input type="number" step="any" id="bsN" value="" placeholder="請輸入 N 坐標">
            </div>
            <div class="form-group">
                <label>設站點 縱座標 (N):</label>
                <input type="number" step="any" id="stN" value="" placeholder="請輸入 N 坐標">
            </div>
            <div class="form-group">
                <label>後視點 橫座標 (E):</label>
                <input type="number" step="any" id="bsE" value="" placeholder="請輸入 E 坐標">
            </div>
            <div class="form-group">
                <label>設站點 橫座標 (E):</label>
                <input type="number" step="any" id="stE" value="" placeholder="請輸入 E 坐標">
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">
        <div class="form-group" style="max-width: 50%;">
            <label>後視點至設站點 實測邊長 (m):</label>
            <input type="number" step="any" id="bsToStDist" value="" placeholder="請輸入實測邊長">
        </div>
    </div>

    <!-- 已知點座標資料庫 (可收合) -->
    <div class="section-box">
        <h3 id="toggleKnownDbHeader">
            <span>📂 已知點座標資料庫 (點擊可展開/收合)</span>
            <span class="toggle-icon" id="toggleIcon">▼ 展開</span>
        </h3>
        <div class="collapsible-content" id="knownDbContent">
            <div class="hint-text">💡 <b>快捷操作</b>：匯入檢測表時，原表上的已知座標會自動同步存入此資料庫中。</div>
            <div class="table-container">
                <table id="knownDbTable">
                    <thead>
                        <tr>
                            <th style="width: 30%;">已知點號 (ID)</th>
                            <th style="width: 30%;">已知 N 座標 (小數點4位)</th>
                            <th style="width: 30%;">已知 E 座標 (小數點4位)</th>
                            <th style="width: 10%;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 動態生成已知點 -->
                    </tbody>
                </table>
            </div>
            <button type="button" id="addKnownRowBtn" class="btn-secondary">＋ 新增已知點資料庫項目</button>
        </div>
    </div>

    <!-- 連續導線點輸入表格 -->
    <div class="section-box">
        <h3>📊 導線前瞻點序列 (依序輸入各站點之邊長與夾角)</h3>
        <div class="table-container" style="margin-top: 10px;">
            <table id="traverseTable">
                <thead>
                    <tr>
                        <th style="width: 8%;">站序</th>
                        <th style="width: 22%;">目標點號 (ID)</th>
                        <th style="width: 25%;">邊長 (m)</th>
                        <th style="width: 35%;">夾角 (度分秒，秒數支援小數)</th>
                        <th style="width: 10%;">操作</th>
                    </tr>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th>
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.8rem; color: #475569;">
                                <span>°</span><span>'</span><span>"</span>
                            </div>
                        </th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 動態生成 -->
                </tbody>
            </table>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增導線延伸點</button>
        </div>
    </div>

    <div class="btn-group">
        <button type="button" id="clearBtn" class="btn-danger-outline">🗑️ 清空導線與起算點 (保留已知點資料庫)</button>
        <button type="button" id="calculateBtn" class="btn-primary">計算連續導線座標與自動比對</button>
        <button type="button" id="exportExcelBtn" class="btn-success">📊 匯出完整 Excel 報表</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleHeader = document.getElementById('toggleKnownDbHeader');
    const knownContent = document.getElementById('knownDbContent');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleHeader.addEventListener('click', function() {
        if (knownContent.style.display === 'block') {
            knownContent.style.display = 'none';
            toggleIcon.textContent = '▼ 展開';
        } else {
            knownContent.style.display = 'block';
            toggleIcon.textContent = '▲ 收合';
        }
    });

    const knownTbody = document.querySelector('#knownDbTable tbody');
    const addKnownRowBtn = document.getElementById('addKnownRowBtn');
    
    const tbody = document.querySelector('#traverseTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearBtn = document.getElementById('clearBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    
    const importReportBtn = document.getElementById('importReportBtn');
    const reportFileImporter = document.getElementById('reportFileImporter');
    
    const resultArea = document.getElementById('resultArea');

    function degToDMS(degDecimal) {
        let d = Math.floor(degDecimal);
        let remainderMin = (degDecimal - d) * 60;
        let m = Math.floor(remainderMin);
        let s = (remainderMin - m) * 60;
        return `${d}° ${String(m).padStart(2, '0')}' ${s.toFixed(4)}''`;
    }

    function pol(n1, e1, n2, e2, p) {
        const PI_VAL = Math.PI;
        let r = Math.pow(Math.pow(n2 - n1, 2) + Math.pow(e2 - e1, 2), 0.5);
        if (p === 1) {
            return r;
        } else {
            let az = 0;
            if (e2 - e1 === 0) {
                az = (n2 - n1 > 0) ? 0 : PI_VAL;
            } else {
                let a = Math.atan((n2 - n1) / (e2 - e1));
                if (e2 - e1 > 0) {
                    az = PI_VAL / 2 - a;
                } else {
                    az = PI_VAL * 3 / 2 - a;
                }
            }
            return az;
        }
    }

    function addKnownRow(id = '', n = '', e = '') {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" class="known-id" value="${id}" placeholder="已知點號"></td>
            <td><input type="number" step="any" class="known-n" value="${n !== '' && !isNaN(n) ? Number(n).toFixed(4) : ''}" placeholder="已知 N"></td>
            <td><input type="number" step="any" class="known-e" value="${e !== '' && !isNaN(e) ? Number(e).toFixed(4) : ''}" placeholder="已知 E"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        row.querySelector('.btn-delete').addEventListener('click', () => {
            row.remove();
            saveDataToLocalStorage();
            updateKnownStatusUI();
        });

        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                saveDataToLocalStorage();
                updateKnownStatusUI();
            });
        });

        knownTbody.appendChild(row);
    }

    function addRow(id = '', dist = '', deg = '', min = '', sec = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td>
                <input type="text" class="input-id" value="${id}" placeholder="例: 點號">
                <div class="known-status"></div>
            </td>
            <td><input type="number" step="any" class="input-dist" value="${dist}" placeholder="邊長(m)"></td>
            <td>
                <div class="angle-inputs">
                    <input type="number" class="input-deg" value="${deg}" placeholder="度">
                    <input type="number" class="input-min" value="${min}" placeholder="分">
                    <input type="number" step="any" class="input-sec" value="${sec}" placeholder="秒">
                </div>
            </td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        newRow.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', saveDataToLocalStorage);
        });

        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            newRow.remove();
            updateRowIndices();
            saveDataToLocalStorage();
        });

        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
        });
    }

    function getKnownDatabase() {
        const db = {};
        const rows = knownTbody.querySelectorAll('tr');
        rows.forEach(row => {
            const id = row.querySelector('.known-id').value.trim();
            const n = parseFloat(row.querySelector('.known-n').value);
            const e = parseFloat(row.querySelector('.known-e').value);
            if (id && !isNaN(n) && !isNaN(e)) {
                db[id] = { n, e };
            }
        });
        return db;
    }

    function updateKnownStatusUI() {
        const db = getKnownDatabase();
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            const id = row.querySelector('.input-id').value.trim();
            const statusDiv = row.querySelector('.known-status');
            if (id && db[id]) {
                statusDiv.innerHTML = `<span class="known-tag">✓ 已對應已知點</span>`;
            } else {
                statusDiv.innerHTML = '';
            }
        });
    }

    function saveDataToLocalStorage() {
        const data = {
            bsId: document.getElementById('bsId').value,
            stId: document.getElementById('stId').value,
            bsN: document.getElementById('bsN').value,
            stN: document.getElementById('stN').value,
            bsE: document.getElementById('bsE').value,
            stE: document.getElementById('stE').value,
            bsToStDist: document.getElementById('bsToStDist').value,
            knownDb: [],
            traverse: []
        };

        knownTbody.querySelectorAll('tr').forEach(row => {
            data.knownDb.push({
                id: row.querySelector('.known-id').value,
                n: row.querySelector('.known-n').value,
                e: row.querySelector('.known-e').value
            });
        });

        tbody.querySelectorAll('tr').forEach(row => {
            data.traverse.push({
                id: row.querySelector('.input-id').value,
                dist: row.querySelector('.input-dist').value,
                deg: row.querySelector('.input-deg').value,
                min: row.querySelector('.input-min').value,
                sec: row.querySelector('.input-sec').value
            });
        });

        localStorage.setItem('traverse_tool_data', JSON.stringify(data));
    }

    function loadDataFromLocalStorage() {
        const saved = localStorage.getItem('traverse_tool_data');
        if (!saved) {
            addKnownRow();
            addRow();
            return;
        }

        try {
            const data = JSON.parse(saved);
            document.getElementById('bsId').value = data.bsId || '';
            document.getElementById('stId').value = data.stId || '';
            document.getElementById('bsN').value = data.bsN !== '' && !isNaN(data.bsN) ? Number(data.bsN).toFixed(4) : '';
            document.getElementById('stN').value = data.stN !== '' && !isNaN(data.stN) ? Number(data.stN).toFixed(4) : '';
            document.getElementById('bsE').value = data.bsE !== '' && !isNaN(data.bsE) ? Number(data.bsE).toFixed(4) : '';
            document.getElementById('stE').value = data.stE !== '' && !isNaN(data.stE) ? Number(data.stE).toFixed(4) : '';
            document.getElementById('bsToStDist').value = data.bsToStDist || '';

            if (data.knownDb && data.knownDb.length > 0) {
                data.knownDb.forEach(k => addKnownRow(k.id, k.n, k.e));
            } else {
                addKnownRow();
            }

            if (data.traverse && data.traverse.length > 0) {
                data.traverse.forEach(t => addRow(t.id, t.dist, t.deg, t.min, t.sec));
            } else {
                addRow();
            }

            updateKnownStatusUI();
        } catch (e) {
            addKnownRow();
            addRow();
        }
    }

    loadDataFromLocalStorage();

    addKnownRowBtn.addEventListener('click', () => {
        addKnownRow();
        saveDataToLocalStorage();
    });

    addRowBtn.addEventListener('click', () => {
        addRow();
        saveDataToLocalStorage();
    });

    importReportBtn.addEventListener('click', () => {
        reportFileImporter.click();
    });

    // 🏆 智慧欄位標題與行對應引擎 (支援多種常見工程報表格式)
    reportFileImporter.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                let records = [];

                // 尋找包含控制點資料的有效列（過濾掉標題列、空白列、專案名稱列）
                for (let i = 0; i < jsonRows.length; i++) {
                    let r = jsonRows[i];
                    if (!r || r.length === 0) continue;

                    // 檢查這列是否有合法的點號與座標
                    // 通常點號在第一個或第二個欄位，且不包含說明文字
                    let possibleId = '';
                    let idColIdx = -1;
                    
                    for (let c = 0; c < Math.min(r.length, 3); c++) {
                        let val = String(r[c] || '').trim();
                        if (val && !val.includes('施工標') && !val.includes('檢測') && !val.includes('日期') && !val.includes('第') && !val.includes('頁') && val.length < 20) {
                            possibleId = val;
                            idColIdx = c;
                            break;
                        }
                    }

                    if (!possibleId) continue;

                    // 在該列中提取所有數字，尋找符合坐標範圍的值 (>1000)
                    let numbersInRow = [];
                    for (let c = 0; c < r.length; c++) {
                        let num = parseFloat(r[c]);
                        if (!isNaN(num)) {
                            numbersInRow.push({ col: c, val: num });
                        }
                    }

                    // 尋找 N 座標與 E 座標（通常數值較大）
                    let coords = numbersInRow.filter(item => item.val > 1000 && item.val < 99999999);
                    let nVal = coords.length > 0 ? coords[0].val : '';
                    let eVal = coords.length > 1 ? coords[1].val : '';

                    // 尋找邊長或角度數字
                    let smalls = numbersInRow.filter(item => item.val > 0 && item.val < 10000);
                    let distVal = smalls.length > 0 ? smalls[0].val : '';
                    
                    // 檢查是否有角度 (度, 分, 秒)
                    let degVal = '', minVal = '', secVal = '';
                    let angleCandidates = numbersInRow.filter(item => item.val >= 0 && item.val < 360);
                    if (angleCandidates.length >= 1) degVal = angleCandidates[0].val;
                    if (angleCandidates.length >= 2) minVal = angleCandidates[1].val;
                    if (angleCandidates.length >= 3) secVal = angleCandidates[2].val;

                    if (nVal !== '' || eVal !== '') {
                        records.push({
                            id: possibleId,
                            n: nVal !== '' ? Number(nVal).toFixed(4) : '',
                            e: eVal !== '' ? Number(eVal).toFixed(4) : '',
                            dist: distVal !== '' ? distVal : '',
                            deg: degVal,
                            min: minVal,
                            sec: secVal
                        });
                    }
                }

                if (records.length < 2) {
                    alert('未能從 Excel 中自動解析出足夠的控制點資料（至少需要後視點與設站點共2點）。請檢查檔案格式或手動輸入！');
                    return;
                }

                // 自動填入起算點 (第1筆為後視點 BS，第2筆為設站點 ST)
                let bs = records[0];
                let st = records[1];

                document.getElementById('bsId').value = bs.id;
                document.getElementById('bsN').value = bs.n;
                document.getElementById('bsE').value = bs.e;

                document.getElementById('stId').value = st.id;
                document.getElementById('stN').value = st.n;
                document.getElementById('stE').value = st.e;
                
                if (bs.dist !== '') {
                    document.getElementById('bsToStDist').value = bs.dist;
                }

                // 同步更新已知點資料庫
                let db = getKnownDatabase();
                if (bs.id && !db[bs.id]) addKnownRow(bs.id, bs.n, bs.e);
                if (st.id && !db[st.id]) addKnownRow(st.id, st.n, st.e);

                // 填入後續導線前瞻點序列 (從第3筆開始)
                tbody.innerHTML = '';
                for (let i = 2; i < records.length; i++) {
                    let prevRec = records[i - 1];
                    let curRec = records[i];

                    addRow(
                        curRec.id, 
                        prevRec.dist !== '' ? prevRec.dist : '', 
                        prevRec.deg !== '' ? prevRec.deg : '', 
                        prevRec.min !== '' ? prevRec.min : '', 
                        prevRec.sec !== '' ? prevRec.sec : ''
                    );
                }

                updateRowIndices();
                updateKnownStatusUI();
                saveDataToLocalStorage();
                alert(`匯入成功！已自動辨識後視點 [${bs.id}]、設站點 [${st.id}] 以及後續 ${records.length - 2} 個導線目標點。`);

            } catch (err) {
                console.error(err);
                alert('匯入解析失敗，請確認上傳的 Excel 檔案格式是否正確！');
            }
            reportFileImporter.value = '';
        };
        reader.readAsArrayBuffer(file);
    });

    clearBtn.addEventListener('click', function() {
        if (confirm('確定清空初始起算點與導線前瞻點嗎？（已知點座標資料庫將會被完整保留）')) {
            document.getElementById('bsId').value = '';
            document.getElementById('stId').value = '';
            document.getElementById('bsN').value = '';
            document.getElementById('stN').value = '';
            document.getElementById('bsE').value = '';
            document.getElementById('stE').value = '';
            document.getElementById('bsToStDist').value = '';
            
            tbody.innerHTML = '';
            addRow();
            saveDataToLocalStorage();
            updateKnownStatusUI();
            resultArea.style.display = 'none';
        }
    });

    function runTraverseCalculation() {
        let currentBsN = parseFloat(document.getElementById('bsN').value);
        let currentBsE = parseFloat(document.getElementById('bsE').value);
        let currentStN = parseFloat(document.getElementById('stN').value);
        let currentStE = parseFloat(document.getElementById('stE').value);
        let bsId = document.getElementById('bsId').value.trim() || 'BS';
        let stId = document.getElementById('stId').value.trim() || 'ST';

        let bsToStDistVal = document.getElementById('bsToStDist').value;

        if (isNaN(currentBsN) || isNaN(currentBsE) || isNaN(currentStN) || isNaN(currentStE)) {
            alert('請完整輸入初始起算點座標！');
            return null;
        }

        const knownDb = getKnownDatabase();
        const rows = tbody.querySelectorAll('tr');
        let legs = [];
        rows.forEach((row, idx) => {
            const id = row.querySelector('.input-id').value.trim() || `P${idx+1}`;
            const distInput = row.querySelector('.input-dist').value;
            const degInput = row.querySelector('.input-deg').value;
            const minInput = row.querySelector('.input-min').value;
            const secInput = row.querySelector('.input-sec').value;

            let known = knownDb[id] || null;

            legs.push({
                id,
                dist: distInput !== '' ? parseFloat(distInput) : '',
                deg: degInput !== '' ? parseFloat(degInput) : '',
                min: minInput !== '' ? parseFloat(minInput) : '',
                sec: secInput !== '' ? parseFloat(secInput) : '',
                knownN: known ? known.n : null,
                knownE: known ? known.e : null
            });
        });

        if (legs.length === 0) return null;

        return {
            initialBsId: bsId,
            initialBsN: currentBsN,
            initialBsE: currentBsE,
            initialStId: stId,
            initialStN: currentStN,
            initialStE: currentStE,
            bsToStDist: bsToStDistVal !== '' ? parseFloat(bsToStDistVal) : '',
            legs: legs
        };
    }

    function calculateAllResults() {
        const raw = runTraverseCalculation();
        if (!raw) return null;

        let results = [];
        let activeBsN = raw.initialBsN;
        let activeBsE = raw.initialBsE;
        let activeStN = raw.initialStN;
        let activeStE = raw.initialStE;
        let activeStId = raw.initialStId;
        const PI_VAL = Math.PI;

        raw.legs.forEach((leg) => {
            let distVal = typeof leg.dist === 'number' ? leg.dist : 0;
            let dDeg = typeof leg.deg === 'number' ? leg.deg : 0;
            let dMin = typeof leg.min === 'number' ? leg.min : 0;
            let dSec = typeof leg.sec === 'number' ? leg.sec : 0;

            let azimuthBS = pol(activeStN, activeStE, activeBsN, activeBsE, 2);
            let angleDeg = dDeg + (dMin / 60) + (dSec / 3600);
            let angleRad = angleDeg * PI_VAL / 180;
            
            let fwdAzRad = azimuthBS + angleRad;
            while (fwdAzRad < 0) fwdAzRad += 2 * PI_VAL;
            while (fwdAzRad >= 2 * PI_VAL) fwdAzRad -= 2 * PI_VAL;

            let dN = distVal * Math.cos(fwdAzRad);
            let dE = distVal * Math.sin(fwdAzRad);

            let targetN = activeStN + dN;
            let targetE = activeStE + dE;
            let fwdAzDeg = fwdAzRad * 180 / PI_VAL;

            let diffN = (leg.knownN !== null) ? (targetN - leg.knownN) * 1000 : null;
            let diffE = (leg.knownE !== null) ? (targetE - leg.knownE) * 1000 : null;

            results.push({
                stationId: activeStId,
                targetId: leg.id,
                n: targetN,
                e: targetE,
                dist: leg.dist,
                deg: leg.deg,
                min: leg.min,
                sec: leg.sec,
                knownN: leg.knownN,
                knownE: leg.knownE,
                diffN: diffN,
                diffE: diffE,
                fwdAzDMS: degToDMS(fwdAzDeg)
            });

            activeBsN = activeStN;
            activeBsE = activeStE;
            activeStN = targetN;
            activeStE = targetE;
            activeStId = leg.id;
        });

        raw.legsCalculated = results;
        return raw;
    }

    calculateBtn.addEventListener('click', function() {
        const data = calculateAllResults();
        if (!data) return;

        let text = `=== 多站連續導線座標與自動比對結果 (小數點 4 位 / 差值 2 位 mm) ===\n`;
        text += `後視點 [${data.initialBsId}] N = ${data.initialBsN.toFixed(4)}, E = ${data.initialBsE.toFixed(4)}\n`;
        text += `設站點 [${data.initialStId}] N = ${data.initialStN.toFixed(4)}, E = ${data.initialStE.toFixed(4)}\n\n`;

        data.legsCalculated.forEach((r, idx) => {
            text += `第 ${idx+1} 站目標: ${r.targetId.padEnd(6)} | 計算 N = ${r.n.toFixed(4)}, E = ${r.e.toFixed(4)}\n`;
            if (r.knownN !== null || r.knownE !== null) {
                let dnStr = r.diffN !== null ? (r.diffN >= 0 ? '+' + r.diffN.toFixed(2) : r.diffN.toFixed(2)) : 'N/A';
                let deStr = r.diffE !== null ? (r.diffE >= 0 ? '+' + r.diffE.toFixed(2) : r.diffE.toFixed(2)) : 'N/A';
                text += `   └─ [資料庫對應] 已知: N=${r.knownN.toFixed(4)}, E=${r.knownE.toFixed(4)} | 較差(計-已): ΔN = ${dnStr} mm, ΔE = ${deStr} mm\n`;
            }
        });

        resultArea.style.display = 'block';
        resultArea.textContent = text;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });

    exportExcelBtn.addEventListener('click', function() {
        const data = calculateAllResults();
        if (!data) return;

        const excelRows = [
            ["點 號", "原始座標值", "", "實測平距", "實測夾角", "", "", "計算後座標", "", "較差(mm)", "", "備註"],
            ["", "N", "E", "", "°", "'", "\"", "N", "E", "N", "E", ""]
        ];

        excelRows.push([
            data.initialBsId,
            data.initialBsN.toFixed(4),
            data.initialBsE.toFixed(4),
            "-", "-", "-", "-",
            data.initialBsN.toFixed(4),
            data.initialBsE.toFixed(4),
            "-", "-",
            "後視點"
        ]);

        excelRows.push([
            data.initialStId,
            data.initialStN.toFixed(4),
            data.initialStE.toFixed(4),
            data.bsToStDist !== '' ? data.bsToStDist : "-",
            "-", "-", "-",
            data.initialStN.toFixed(4),
            data.initialStE.toFixed(4),
            "-", "-",
            "起始點"
        ]);

        data.legsCalculated.forEach((r) => {
            excelRows.push([
                r.targetId,
                r.knownN !== null ? r.knownN.toFixed(4) : "",
                r.knownE !== null ? r.knownE.toFixed(4) : "",
                r.dist !== '' ? r.dist : "",
                r.deg !== '' ? r.deg : "-",
                r.min !== '' ? r.min : "-",
                r.sec !== '' ? r.sec : "-",
                r.n.toFixed(4),
                r.e.toFixed(4),
                r.diffN !== null ? r.diffN.toFixed(2) : "",
                r.diffE !== null ? r.diffE.toFixed(2) : "",
                ""
            ]);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelRows);

        XLSX.utils.book_append_sheet(wb, ws, "座標計算與差值表");
        XLSX.writeFile(wb, `連續導線座標與差值報表_${new Date().toISOString().slice(0, 10)}.xlsx`);
    });
});
</script>
