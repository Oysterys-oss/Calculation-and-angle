<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連續測量導線計算 (N, E 座標版)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 900px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .input-section { margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 14px; }
        button { background: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; }
        button:hover { background: #219653; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .note { font-size: 13px; color: #555; margin-top: 8px; line-height: 1.5; }
        .summary { margin-top: 15px; font-weight: bold; color: #2c3e50; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>連續導線方位角與距離計算 (N, E 格式)</h2>
    
    <div class="input-section">
        <label><strong>請依序輸入點位座標（格式：點名, N坐標, E坐標）：</strong></label>
        <textarea id="pointsInput" placeholder="例如:
GU04 2764649.9410 308235.9495
GU05 2764662.2183 308296.8343"></textarea>
        <div class="note">
            💡 <strong>說明：</strong>支援直接貼上從 Excel 複製的資料（點名、N坐標、E坐標），中間用逗號或空格隔開皆可。
        </div>
    </div>

    <button onclick="calculateTraverse()">開始計算各段與總距離</button>

    <div id="resultArea" style="margin-top: 20px; display: none;">
        <div class="summary" id="totalSummary"></div>
        <div style="overflow-x: auto;">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>區段</th>
                        <th>起點</th>
                        <th>終點</th>
                        <th>水平距離 (m)</th>
                        <th>方位角 (十進位)</th>
                        <th>方位角 (DMS 度分秒)</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function degToDMS(deg) {
    let d = Math.floor(deg);
    let mFloat = (deg - d) * 60;
    let m = Math.floor(mFloat);
    let s = Math.round(((mFloat - m) * 60)); // 四舍五入到整秒，符合一般測量習慣
    if (s === 60) { m += 1; s = 0; }
    if (m === 60) { d += 1; m = 0; }
    return `${d}° ${m}' ${s}"`;
}

function calculateTraverse() {
    let rawText = document.getElementById('pointsInput').value.trim();
    if (!rawText) {
        alert("請輸入座標資料！");
        return;
    }

    let lines = rawText.split('\n');
    let points = [];

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        
        let parts = line.split(/[,\t\s]+/);
        if (parts.length >= 3) {
            let name = parts[0];
            let nCoord = parseFloat(parts[1]); // 第一個數值為 N
            let eCoord = parseFloat(parts[2]); // 第二個數值為 E
            if (!isNaN(nCoord) && !isNaN(eCoord)) {
                points.push({ name: name, n: nCoord, e: eCoord });
            }
        }
    }

    if (points.length < 2) {
        alert("至少需要輸入兩個點才能計算！");
        return;
    }

    let tbody = document.getElementById('resultBody');
    tbody.innerHTML = "";
    
    let totalDistance = 0;

    for (let i = 0; i < points.length - 1; i++) {
        let p1 = points[i];
        let p2 = points[i+1];

        // 測量方位角計算公式 (針對 N 在前、E 在後)：
        // dN = N2 - N1, dE = E2 - E1
        let dn = p2.n - p1.n;
        let de = p2.e - p1.e;

        let distance = Math.sqrt(dn * dn + de * de);
        totalDistance += distance;

        // 以 N 軸為基準的方位角計算 (atan2(de, dn))
        let angleRad = Math.atan2(de, dn);
        let angleDeg = angleRad * (180 / Math.PI);

        if (angleDeg < 0) {
            angleDeg += 360;
        }

        let row = `<tr>
            <td><strong>#${i+1}</strong></td>
            <td>${p1.name}</td>
            <td>${p2.name}</td>
            <td>${distance.toFixed(3)}</td>
            <td>${angleDeg.toFixed(4)}°</td>
            <td>${degToDMS(angleDeg)}</td>
        </tr>`;
        tbody.innerHTML += row;
    }

    document.getElementById('totalSummary').innerText = `總測點數：${points.length} 個點 | 總導線長度：${totalDistance.toFixed(3)} 公尺`;
    document.getElementById('resultTable').style.display = 'table';
}
</script>

</body>
</html>
