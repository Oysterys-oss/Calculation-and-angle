<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub 線上 Excel 試算表</title>
    
    <!-- 引入 Luckysheet 的 CSS 樣式 -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/Plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/css/luckysheet.css' />
    
    <!-- 引入 Luckysheet 的 JavaScript 套件 -->
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@latest/dist/luckysheet.umd.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f4f5f7;
        }
        #header {
            height: 50px;
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #24292e;
        }
        #luckysheet {
            margin: 0px;
            padding: 0px;
            position: absolute;
            width: 100%;
            top: 50px;
            bottom: 0px;
            left: 0px;
        }
    </style>
</head>
<body>

    <div id="header">📊 我的線上試算表（可直接編輯與計算）</div>
    <div id="luckysheet"></div>

    <script>
        window.onload = function () {
            luckysheet.create({
                container: 'luckysheet', // 對應上方 div 的 id
                title: '線上試算表',     // 試算表標題
                lang: 'zh',              // 介面語言設為中文
                data: [
                    {
                        name: "工作表1",   // 分頁名稱
                        color: "",
                        status: "1",
                        order: "0",
                        data: [
                            // 這裡可以預設一些範例資料（支援點擊修改、公式計算等）
                            [
                                {v: "項目", bg: "#0366d6", color: "#ffffff", ct: {fa: "@", t: "s"}},
                                {v: "數量", bg: "#0366d6", color: "#ffffff", ct: {fa: "@", t: "s"}},
                                {v: "單價", bg: "#0366d6", color: "#ffffff", ct: {fa: "@", t: "s"}},
                                {v: "總價 (公式)", bg: "#0366d6", color: "#ffffff", ct: {fa: "@", t: "s"}}
                            ],
                            [
                                {v: "範例項目 A"}, {v: 5}, {v: 100}, {v: "=B2*C2", m: "500", f: "=B2*C2"}
                            ],
                            [
                                {v: "範例項目 B"}, {v: 2}, {v: 250}, {v: "=B3*C3", m: "500", f: "=B3*C3"}
                            ]
                        ]
                    }
                ]
            });
        }
    </script>
</body>
</html>
