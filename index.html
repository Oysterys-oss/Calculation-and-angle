<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測量導線與方位角計算工具</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .batch-paste-box {
            background-color: #f1f5f9;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .batch-paste-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #334155;
        }

        .batch-paste-box textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>測量導線與方位角計算工具</h1>
    <p class="subtitle">座標系統：X 軸為北向、Y 軸為東向（方位角：北向 0° 順時針）</p>

    <!-- Excel 批次貼上專用區塊 -->
    <div class="batch-paste-box">
        <label for="batchInput">📋 Excel 批次帶入區（請在此處按 Ctrl + V 貼上多行資料）：</label>
        <textarea id="batchInput" placeholder="在此處點擊並按下 Ctrl + V，格式支援：點號 \t X座標 \t Y座標"></textarea>
        <button type="button" id="importBtn" class="btn-secondary" style="margin-top: 8px; width: 100%;">將上方文字帶入下方表格</button>
    </div>

    <div class="table-container">
        <table id="coordTable">
            <thead>
                <tr>
                    <th style="width: 10%;">項次</th>
                    <th style="width: 25%;">點號 (ID)</th>
                    <th style="width: 30%;">X 座標 (北向)</th>
                    <th style="width: 30%;">Y 座標 (東向)</th>
                    <th style="width: 15%;">操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 預設兩行 -->
                <tr>
                    <td class="row-index">1</td>
                    <td><input type="text" class="input-id" value="A1" placeholder="例: A1"></td>
                    <td><input type="number" step="any" class="input-x" placeholder="例: 2500000.000"></td>
                    <td><input type="number" step="any" class="input-y" placeholder="例: 200000.000"></td>
                    <td><button type="button" class="btn-delete">刪除</button></td>
                </tr>
                <tr>
                    <td class="row-index">2</td>
                    <td><input type="text" class="input-id" value="A2" placeholder="例: A2"></td>
                    <td><input type="number" step="any" class="input-x" placeholder="例: 2500100.000"></td>
                    <td><input type="number" step="any" class="input-y" placeholder="例: 200050.000"></td>
                    <td><button type="button" class="btn-delete">刪除</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="btn-group">
        <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增導線點</button>
        <button type="button" id="calculateBtn" class="btn-primary">開始計算導線</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tbody = document.querySelector('#coordTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultArea = document.getElementById('resultArea');
    const batchInput = document.getElementById('batchInput');
    const importBtn = document.getElementById('importBtn');

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            const indexCell = row.querySelector('.row-index');
            if (indexCell) {
                indexCell.textContent = index + 1;
            }
        });
    }

    function addRow(id = '', x = '', y = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: P01"></td>
            <td><input type="number" step="any" class="input-x" value="${x}" placeholder="X座標"></td>
            <td><input type="number" step="any" class="input-y" value="${y}" placeholder="Y座標"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;
        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            deleteRow(this);
        });
        tbody.appendChild(newRow);
        updateRowIndices();
        return newRow;
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        if (tbody.rows.length > 1) {
            row.remove();
            updateRowIndices();
        } else {
            row.querySelector('.input-id').value = '';
            row.querySelector('.input-x').value = '';
            row.querySelector('.input-y').value = '';
        }
    }

    // 綁定現有刪除按鈕
    tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', function() {
            deleteRow(this);
        });
    });

    addRowBtn.addEventListener('click', function() {
        addRow();
    });

    // 批次匯入按鈕事件
    importBtn.addEventListener('click', function() {
        const text = batchInput.value.trim();
        if (!text) {
            alert('請先在上方文字框貼上 Excel 資料！');
            return;
        }

        const lines = text.split(/\r\n|\n/);
        
        // 檢查是否要清空舊資料或從頭填入
        const rows = tbody.querySelectorAll('tr');
        let rowIndex = 0;

        lines.forEach((line) => {
            if (!line.trim()) return;
            const cols = line.split('\t'); // Excel 複製的分隔符號
            
            if (cols.length >= 3) {
                const id = cols[0].trim();
                const x = cols[1].trim();
                const y = cols[2].trim();

                if (rowIndex < rows.length) {
                    // 填入現有行
                    rows[rowIndex].querySelector('.input-id').value = id;
                    rows[rowIndex].querySelector('.input-x').value = x;
                    rows[rowIndex].querySelector('.input-y').value = y;
                } else {
                    // 超過現有行則自動新增
                    addRow(id, x, y);
                }
                rowIndex++;
            }
        });

        updateRowIndices();
        alert(`成功匯入 ${rowIndex} 筆座標資料！`);
        batchInput.value = ''; // 清空文字框
    });

    // 計算邏輯
    calculateBtn.addEventListener('click', function() {
        const rows = tbody.querySelectorAll('tr');
        const coordinates = [];

        rows.forEach((row, idx) => {
            const idInput = row.querySelector('.input-id');
            const xInput = row.querySelector('.input-x');
            const yInput = row.querySelector('.input-y');

            if (idInput && xInput && yInput) {
                const id = idInput.value.trim() || `P${idx + 1}`;
                const x = parseFloat(xInput.value);
                const y = parseFloat(yInput.value);

                if (!isNaN(x) && !isNaN(y)) {
                    coordinates.push({ id, x, y });
                }
            }
        });

        if (coordinates.length < 2) {
            alert('請至少輸入兩筆有效的座標（包含X與Y）才能計算！');
            return;
        }

        let resultText = "=== 導線計算結果 (測量學方位角: 北向0°順時針) ===\n\n";
        
        for (let i = 0; i < coordinates.length - 1; i++) {
            const p1 = coordinates[i];
            const p2 = coordinates[i + 1];

            const dx = p2.x - p1.x; // 北向差
            const dy = p2.y - p1.y; // 東向差
            
            const distance = Math.sqrt(dx * dx + dy * dy);

            let angleRad = Math.atan2(dy, dx);
            let angleDeg = angleRad * (180 / Math.PI);
            
            if (angleDeg < 0) {
                angleDeg += 360;
            }

            const deg = Math.floor(angleDeg);
            const minFloat = (angleDeg - deg) * 60;
            const min = Math.floor(minFloat);
            const sec = ((minFloat - min) * 60).toFixed(1);

            resultText += `路段：${p1.id} ➔ ${p2.id}\n`;
            resultText += `  ΔX (北向差): ${dx.toFixed(4)} m | ΔY (東向差): ${dy.toFixed(4)} m\n`;
            resultText += `  距離: ${distance.toFixed(3)} 公尺\n`;
            resultText += `  方位角: ${deg}° ${min}′ ${sec}″ (${angleDeg.toFixed(4)}°)\n\n`;
        }

        resultArea.style.display = 'block';
        resultArea.textContent = resultText;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });
});
</script>

</body>
</html>
