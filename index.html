<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面控制點檢測成果表 - 自動化匯入系統</title>
    <!-- 引入 SheetJS 用於前端 Excel 讀寫 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .section-box {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .section-box h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .section-box h3 .toggle-icon {
            font-size: 0.9rem;
            color: #64748b;
        }

        .collapsible-content {
            display: none;
            margin-top: 10px;
        }

        .hint-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        th {
            background-color: #e2e8f0;
            font-weight: 600;
        }

        .angle-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }

        .angle-inputs input {
            text-align: center;
            padding: 6px 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary-color); color: white; flex: 2; }
        .btn-success { background-color: var(--success-color); color: white; flex: 1.5; }
        .btn-info { background-color: #0284c7; color: white; flex: 1.5; }
        .btn-secondary { background-color: #e2e8f0; color: var(--text-color); flex: 1; }
        .btn-danger-outline { background-color: #fff; color: var(--danger-color); border: 1px solid var(--danger-color); flex: 1; }

        .known-tag {
            font-size: 0.8rem;
            color: #16a34a;
            background: #dcfce7;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>平面控制點檢測成果表 - 自動化匯入系統</h1>

    <!-- 隱藏的檔案上傳 Input -->
    <input type="file" id="reportFileImporter" accept=".xlsx, .xls, .csv" style="display: none;">

    <!-- 起始後視點與設站點 -->
    <div class="section-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0;">📍 導線起算點與第一站實測資料 (第 1 站)</h3>
            <button type="button" id="selectFileBtn" class="btn-info" style="padding: 6px 12px; font-size: 0.85rem;">📂 一鍵匯入 Excel 成果表</button>
        </div>
        <div class="grid-2" style="margin-top: 10px;">
            <div class="form-group">
                <label>初始後視點 點號 (BS):</label>
                <input type="text" id="bsId" value="" placeholder="例: Y251">
            </div>
            <div class="form-group">
                <label>初始設站點 點號 (ST):</label>
                <input type="text" id="stId" value="" placeholder="例: Y250">
            </div>
            <div class="form-group">
                <label>後視點 縱座標 (N):</label>
                <input type="number" step="any" id="bsN" value="" placeholder="請輸入 N 坐標">
            </div>
            <div class="form-group">
                <label>設站點 縱座標 (N):</label>
                <input type="number" step="any" id="stN" value="" placeholder="請輸入 N 坐標">
            </div>
            <div class="form-group">
                <label>後視點 橫座標 (E):</label>
                <input type="number" step="any" id="bsE" value="" placeholder="請輸入 E 坐標">
            </div>
            <div class="form-group">
                <label>設站點 橫座標 (E):</label>
                <input type="number" step="any" id="stE" value="" placeholder="請輸入 E 坐標">
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">
        <div class="form-group" style="max-width: 50%;">
            <label>後視點至設站點 實測邊長 (m):</label>
            <input type="number" step="any" id="bsToStDist" value="" placeholder="請輸入實測邊長">
        </div>
    </div>

    <!-- 已知點座標資料庫 -->
    <div class="section-box">
        <h3 id="toggleKnownDbHeader">
            <span>📂 已知點座標資料庫 (點擊可展開/收合)</span>
            <span class="toggle-icon" id="toggleIcon">▼ 展開</span>
        </h3>
        <div class="collapsible-content" id="knownDbContent">
            <div class="hint-text">💡 <b>說明</b>：匯入檢測表時，原表上的已知座標會自動同步存入此資料庫中。</div>
            <div class="table-container">
                <table id="knownDbTable">
                    <thead>
                        <tr>
                            <th style="width: 30%;">已知點號 (ID)</th>
                            <th style="width: 30%;">已知 N 座標</th>
                            <th style="width: 30%;">已知 E 座標</th>
                            <th style="width: 10%;">操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button type="button" id="addKnownRowBtn" class="btn-secondary">＋ 新增已知點資料庫項目</button>
        </div>
    </div>

    <!-- 連續導線點輸入表格 -->
    <div class="section-box">
        <h3>📊 導線前瞻點序列 (依序輸入目標點、邊長與實測夾角)</h3>
        <div class="table-container" style="margin-top: 10px;">
            <table id="traverseTable">
                <thead>
                    <tr>
                        <th style="width: 8%;">站序</th>
                        <th style="width: 22%;">目標點號 (ID)</th>
                        <th style="width: 25%;">實測邊長 (m)</th>
                        <th style="width: 35%;">實測夾角 (度、分、秒)</th>
                        <th style="width: 10%;">操作</th>
                    </tr>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th>
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 0.8rem; color: #475569;">
                                <span>°</span><span>'</span><span>"</span>
                            </div>
                        </th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增導線延伸點</button>
    </div>

    <div class="btn-group">
        <button type="button" id="clearBtn" class="btn-danger-outline">🗑️ 清空導線與起算點</button>
        <button type="button" id="calculateBtn" class="btn-primary">計算完整成果表 (含反算平距、反算夾角與較差比對)</button>
        <button type="button" id="exportExcelBtn" class="btn-success">📊 匯出完整檢測成果表 Excel</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleHeader = document.getElementById('toggleKnownDbHeader');
    const knownContent = document.getElementById('knownDbContent');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleHeader.addEventListener('click', function() {
        if (knownContent.style.display === 'block') {
            knownContent.style.display = 'none';
            toggleIcon.textContent = '▼ 展開';
        } else {
            knownContent.style.display = 'block';
            toggleIcon.textContent = '▲ 收合';
        }
    });

    const knownTbody = document.querySelector('#knownDbTable tbody');
    const addKnownRowBtn = document.getElementById('addKnownRowBtn');
    
    const tbody = document.querySelector('#traverseTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const clearBtn = document.getElementById('clearBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    
    const selectFileBtn = document.getElementById('selectFileBtn');
    const reportFileImporter = document.getElementById('reportFileImporter');
    
    const resultArea = document.getElementById('resultArea');

    selectFileBtn.addEventListener('click', () => reportFileImporter.click());

    reportFileImporter.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rowsData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                // 自動化解析設定（預設對應您的固定欄位索引）
                const startRow = 4;
                const colId = 0;
                const colN = 1;
                const colE = 2;
                const colDist = 4;
                const colAngle = 9;

                let extractedRows = [];

                for (let i = startRow; i < rowsData.length; i++) {
                    let r = rowsData[i];
                    if (!r || r.length === 0) continue;

                    let id = String(r[colId] || '').trim();
                    let n = parseFloat(r[colN]);
                    let e = parseFloat(r[colE]);
                    let dist = colDist >= 0 && r[colDist] !== undefined ? parseFloat(r[colDist]) : '';
                    
                    let deg = '', min = '', sec = '';
                    if (colAngle >= 0 && r[colAngle] !== undefined) {
                        deg = parseFloat(r[colAngle]) || 0;
                        min = colAngle + 1 < r.length ? (parseFloat(r[colAngle + 1]) || 0) : 0;
                        sec = colAngle + 2 < r.length ? (parseFloat(r[colAngle + 2]) || 0) : 0;
                    }

                    if (id && !isNaN(n) && !isNaN(e)) {
                        extractedRows.push({
                            id, n, e,
                            dist: !isNaN(dist) ? dist : '',
                            deg, min, sec
                        });
                    }
                }

                if (extractedRows.length < 2) {
                    alert('抓取到的有效點位少於 2 個，請檢查檔案格式是否正確。');
                    return;
                }

                let bs = extractedRows[0];
                let st = extractedRows[1];

                document.getElementById('bsId').value = bs.id;
                document.getElementById('bsN').value = bs.n.toFixed(4);
                document.getElementById('bsE').value = bs.e.toFixed(4);

                document.getElementById('stId').value = st.id;
                document.getElementById('stN').value = st.n.toFixed(4);
                document.getElementById('stE').value = st.e.toFixed(4);

                if (bs.dist !== '') {
                    document.getElementById('bsToStDist').value = bs.dist;
                }

                let db = getKnownDatabase();
                extractedRows.forEach(p => {
                    if (!db[p.id]) addKnownRow(p.id, p.n.toFixed(4), p.e.toFixed(4));
                });

                tbody.innerHTML = '';
                for (let i = 1; i < extractedRows.length; i++) {
                    let cur = extractedRows[i];
                    addRow(cur.id, cur.dist, cur.deg, cur.min, cur.sec);
                }

                updateRowIndices();
                updateKnownStatusUI();
                saveDataToLocalStorage();
                alert(`成功自動匯入 ${extractedRows.length} 筆點位資料！`);
            } catch (err) {
                alert('讀取 Excel 失敗：' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function degToDMSParts(degDecimal) {
        if (isNaN(degDecimal) || degDecimal === '') return { d: '', m: '', s: '' };
        let d = Math.floor(degDecimal);
        let remainderMin = (degDecimal - d) * 60;
        let m = Math.floor(remainderMin);
        let s = (remainderMin - m) * 60;
        return { d, m, s };
    }

    function getAzimuth(n1, e1, n2, e2) {
        const PI = Math.PI;
        let dn = n2 - n1;
        let de = e2 - e1;
        if (de === 0) return dn >= 0 ? 0 : PI;
        let az = Math.atan(Math.abs(de) / Math.abs(dn));
        if (dn >= 0 && de > 0) return az;
        if (dn < 0 && de > 0) return PI - az;
        if (dn < 0 && de < 0) return PI + az;
        if (dn >= 0 && de < 0) return 2 * PI - az;
        return 0;
    }

    function getDistance(n1, e1, n2, e2) {
        return Math.sqrt(Math.pow(n2 - n1, 2) + Math.pow(e2 - e1, 2));
    }

    function addKnownRow(id = '', n = '', e = '') {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" class="known-id" value="${id}" placeholder="已知點號"></td>
            <td><input type="number" step="any" class="known-n" value="${n !== '' && !isNaN(n) ? Number(n).toFixed(4) : ''}" placeholder="已知 N"></td>
            <td><input type="number" step="any" class="known-e" value="${e !== '' && !isNaN(e) ? Number(e).toFixed(4) : ''}" placeholder="已知 E"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        row.querySelector('.btn-delete').addEventListener('click', () => {
            row.remove();
            saveDataToLocalStorage();
            updateKnownStatusUI();
        });

        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                saveDataToLocalStorage();
                updateKnownStatusUI();
            });
        });

        knownTbody.appendChild(row);
    }

    function addRow(id = '', dist = '', deg = '', min = '', sec = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td>
                <input type="text" class="input-id" value="${id}" placeholder="點號">
                <div class="known-status"></div>
            </td>
            <td><input type="number" step="any" class="input-dist" value="${dist}" placeholder="邊長(m)"></td>
            <td>
                <div class="angle-inputs">
                    <input type="number" class="input-deg" value="${deg !== undefined ? deg : ''}" placeholder="度">
                    <input type="number" class="input-min" value="${min !== undefined ? min : ''}" placeholder="分">
                    <input type="number" step="any" class="input-sec" value="${sec !== undefined ? sec : ''}" placeholder="秒">
                </div>
            </td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;

        newRow.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', saveDataToLocalStorage);
        });

        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            newRow.remove();
            updateRowIndices();
            saveDataToLocalStorage();
        });

        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-index').textContent = index + 1;
        });
    }

    function getKnownDatabase() {
        const db = {};
        const rows = knownTbody.querySelectorAll('tr');
        rows.forEach(row => {
            const id = row.querySelector('.known-id').value.trim();
            const n = parseFloat(row.querySelector('.known-n').value);
            const e = parseFloat(row.querySelector('.known-e').value);
            if (id && !isNaN(n) && !isNaN(e)) {
                db[id] = { n, e };
            }
        });
        return db;
    }

    function updateKnownStatusUI() {
        const db = getKnownDatabase();
        const rows = tbody.querySelectorAll('tr');
        rows.forEach(row => {
            const id = row.querySelector('.input-id').value.trim();
            const statusDiv = row.querySelector('.known-status');
            if (id && db[id]) {
                statusDiv.innerHTML = `<span class="known-tag">✓ 已對應已知點</span>`;
            } else {
                statusDiv.innerHTML = '';
            }
        });
    }

    function saveDataToLocalStorage() {
        const data = {
            bsId: document.getElementById('bsId').value,
            stId: document.getElementById('stId').value,
            bsN: document.getElementById('bsN').value,
            stN: document.getElementById('stN').value,
            bsE: document.getElementById('bsE').value,
            stE: document.getElementById('stE').value,
            bsToStDist: document.getElementById('bsToStDist').value,
            knownDb: [],
            traverse: []
        };

        knownTbody.querySelectorAll('tr').forEach(row => {
            data.knownDb.push({
                id: row.querySelector('.known-id').value,
                n: row.querySelector('.known-n').value,
                e: row.querySelector('.known-e').value
            });
        });

        tbody.querySelectorAll('tr').forEach(row => {
            data.traverse.push({
                id: row.querySelector('.input-id').value,
                dist: row.querySelector('.input-dist').value,
                deg: row.querySelector('.input-deg').value,
                min: row.querySelector('.input-min').value,
                sec: row.querySelector('.input-sec').value
            });
        });

        localStorage.setItem('traverse_tool_data_v8', JSON.stringify(data));
    }

    function loadDataFromLocalStorage() {
        const saved = localStorage.getItem('traverse_tool_data_v8');
        if (!saved) {
            addKnownRow();
            addRow();
            return;
        }

        try {
            const data = JSON.parse(saved);
            document.getElementById('bsId').value = data.bsId || '';
            document.getElementById('stId').value = data.stId || '';
            document.getElementById('bsN').value = data.bsN !== '' && !isNaN(data.bsN) ? Number(data.bsN).toFixed(4) : '';
            document.getElementById('stN').value = data.stN !== '' && !isNaN(data.stN) ? Number(data.stN).toFixed(4) : '';
            document.getElementById('bsE').value = data.bsE !== '' && !isNaN(data.bsE) ? Number(data.bsE).toFixed(4) : '';
            document.getElementById('stE').value = data.stE !== '' && !isNaN(data.stE) ? Number(data.stE).toFixed(4) : '';
            document.getElementById('bsToStDist').value = data.bsToStDist || '';

            if (data.knownDb && data.knownDb.length > 0) {
                data.knownDb.forEach(k => addKnownRow(k.id, k.n, k.e));
            } else {
                addKnownRow();
            }

            if (data.traverse && data.traverse.length > 0) {
                data.traverse.forEach(t => addRow(t.id, t.dist, t.deg, t.min, t.sec));
            } else {
                addRow();
            }

            updateKnownStatusUI();
        } catch (e) {
            addKnownRow();
            addRow();
        }
    }

    loadDataFromLocalStorage();

    addKnownRowBtn.addEventListener('click', () => {
        addKnownRow();
        saveDataToLocalStorage();
    });

    addRowBtn.addEventListener('click', () => {
        addRow();
        saveDataToLocalStorage();
    });

    clearBtn.addEventListener('click', function() {
        if (confirm('確定清空起算點與導線點嗎？')) {
            document.getElementById('bsId').value = '';
            document.getElementById('stId').value = '';
            document.getElementById('bsN').value = '';
            document.getElementById('stN').value = '';
            document.getElementById('bsE').value = '';
            document.getElementById('stE').value = '';
            document.getElementById('bsToStDist').value = '';
            
            tbody.innerHTML = '';
            addRow();
            saveDataToLocalStorage();
            updateKnownStatusUI();
            resultArea.style.display = 'none';
        }
    });

    function runCalculation() {
        let bsN = parseFloat(document.getElementById('bsN').value);
        let bsE = parseFloat(document.getElementById('bsE').value);
        let stN = parseFloat(document.getElementById('stN').value);
        let stE = parseFloat(document.getElementById('stE').value);
        let bsId = document.getElementById('bsId').value.trim() || 'BS';
        let stId = document.getElementById('stId').value.trim() || 'ST';
        let bsToStDist = parseFloat(document.getElementById('bsToStDist').value) || 0;

        if (isNaN(bsN) || isNaN(bsE) || isNaN(stN) || isNaN(stE)) {
            alert('請完整輸入初始起算點座標！');
            return null;
        }

        const knownDb = getKnownDatabase();
        const rows = tbody.querySelectorAll('tr');
        let legs = [];
        rows.forEach((row, idx) => {
            const id = row.querySelector('.input-id').value.trim() || `P${idx+1}`;
            const dist = parseFloat(row.querySelector('.input-dist').value) || 0;
            const deg = parseFloat(row.querySelector('.input-deg').value) || 0;
            const min = parseFloat(row.querySelector('.input-min').value) || 0;
            const sec = parseFloat(row.querySelector('.input-sec').value) || 0;
            let known = knownDb[id] || null;

            legs.push({ id, dist, deg, min, sec, knownN: known ? known.n : null, knownE: known ? known.e : null });
        });

        if (legs.length === 0) return null;

        let results = [];
        let curBsN = bsN;
        let curBsE = bsE;
        let curStN = stN;
        let curStE = stE;
        let curStId = stId;

        let firstCalcDist = getDistance(bsN, bsE, stN, stE);

        legs.forEach((leg) => {
            let azBS = getAzimuth(curBsN, curBsE, curStN, curStE);
            let measuredAngleDeg = leg.deg + (leg.min / 60) + (leg.sec / 3600);
            let measuredAngleRad = measuredAngleDeg * Math.PI / 180;

            let fwdAzRad = azBS + measuredAngleRad;
            const PI2 = 2 * Math.PI;
            while (fwdAzRad < 0) fwdAzRad += PI2;
            while (fwdAzRad >= PI2) fwdAzRad -= PI2;

            let dN = leg.dist * Math.cos(fwdAzRad);
            let dE = leg.dist * Math.sin(fwdAzRad);
            let targetN = curStN + dN;
            let targetE = curStE + dE;

            let calcDist = getDistance(curStN, curStE, targetN, targetE);

            results.push({
                stationId: curStId,
                targetId: leg.id,
                measuredDist: leg.dist,
                calcDist: calcDist,
                distDiff: (calcDist - leg.dist) * 1000,
                measuredAngleDeg: measuredAngleDeg,
                targetN: targetN,
                targetE: targetE,
                knownN: leg.knownN,
                knownE: leg.knownE,
                diffN: leg.knownN !== null ? (targetN - leg.knownN) * 1000 : null,
                diffE: leg.knownE !== null ? (targetE - leg.knownE) * 1000 : null
            });

            curBsN = curStN;
            curBsE = curStE;
            curStN = targetN;
            curStE = targetE;
            curStId = leg.id;
        });

        return {
            initialBsId: bsId, bsN, bsE,
            initialStId: stId, stN, stE,
            bsToStDist, firstCalcDist,
            legsCalculated: results
        };
    }

    calculateBtn.addEventListener('click', function() {
        const data = runCalculation();
        if (!data) return;

        let text = `=== 平面控制點檢測成果表計算結果 ===\n`;
        text += `後視點 [${data.initialBsId}] N=${data.bsN?.toFixed(4)}, E=${data.bsE?.toFixed(4)}\n`;
        text += `設站點 [${data.initialStId}] N=${data.stN?.toFixed(4)}, E=${data.stE?.toFixed(4)}\n`;
        text += `後視點至設站點實測邊長: ${data.bsToStDist} m\n\n`;

        data.legsCalculated.forEach((r, idx) => {
            text += `站序 ${idx+1} -> 目標點: ${r.targetId}\n`;
            text += `   實測平距: ${r.measuredDist} m | 反算平距: ${r.calcDist.toFixed(4)} m\n`;
            text += `   計算座標: N=${r.targetN.toFixed(4)}, E=${r.targetE.toFixed(4)}\n`;
            if (r.knownN !== null) {
                text += `   已知對應: ΔN=${r.diffN.toFixed(2)} mm, ΔE=${r.diffE.toFixed(2)} mm\n`;
            }
            text += `--------------------------------------------------\n`;
        });

        resultArea.style.display = 'block';
        resultArea.textContent = text;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });

    exportExcelBtn.addEventListener('click', function() {
        const data = runCalculation();
        if (!data) return;

        const excelRows = [
            ["平面控制點檢測成果表"],
            [`施工標別：控制點檢測`],
            ["點號", "原始座標值(N)", "原始座標值(E)", "反算平距", "實測平距", "較差(mm)", "反算夾角", "", "", "實測夾角", "", "", "較差(\")", "是否容許", "計算座標(N)", "計算座標(E)"],
            ["", "", "", "", "", "", "度", "分", "秒", "度", "分", "秒", "", "", "", ""]
        ];

        excelRows.push([
            data.initialBsId, data.bsN.toFixed(4), data.bsE.toFixed(4), "-", "-", "-", "-", "-", "-", "-", "-", "-", "-", "-", data.bsN.toFixed(4), data.bsE.toFixed(4)
        ]);

        excelRows.push([
            data.initialStId, data.stN.toFixed(4), data.stE.toFixed(4), data.firstCalcDist.toFixed(4), data.bsToStDist || "-", "-", "-", "-", "-", "-", "-", "-", "-", "-", data.stN.toFixed(4), data.stE.toFixed(4)
        ]);

        data.legsCalculated.forEach((r) => {
            let mDMS = r.measuredAngleDeg > 0 ? degToDMSParts(r.measuredAngleDeg) : { d: "", m: "", s: "" };
            excelRows.push([
                r.targetId,
                r.knownN !== null ? r.knownN.toFixed(4) : "",
                r.knownE !== null ? r.knownE.toFixed(4) : "",
                r.calcDist.toFixed(4),
                r.measuredDist,
                r.distDiff.toFixed(1),
                "-", "-", "-",
                mDMS.d, mDMS.m, mDMS.s !== "" ? Number(mDMS.s.toFixed(1)) : "",
                "-", "是",
                r.targetN.toFixed(4),
                r.targetE.toFixed(4)
            ]);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        XLSX.utils.book_append_sheet(wb, ws, "檢測成果表");
        XLSX.writeFile(wb, `平面控制點檢測成果表_${new Date().toISOString().slice(0, 10)}.xlsx`);
    });
});
</script>
