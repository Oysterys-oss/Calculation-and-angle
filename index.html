<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>導線計算</title>
    <style>
        .coordinate-container {
            font-family: sans-serif;
            max-width: 700px;
            margin: 20px auto;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .table-wrapper {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #coordTable {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        #coordTable th, #coordTable td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }
        #coordTable th {
            background-color: #f1f1f1;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        #coordTable input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .row-index {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background-color: #cc0000;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .btn-primary {
            flex: 1;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #218838;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="coordinate-container">
    <h3>請輸入座標資料：</h3>
    
    <div class="table-wrapper">
        <table id="coordTable">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>點號 (Point ID)</th>
                    <th>X 座標</th>
                    <th>Y 座標</th>
                    <th style="width: 60px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="row-index">1</td>
                    <td><input type="text" class="input-id" placeholder="例: GU04"></td>
                    <td><input type="number" step="any" class="input-x" placeholder="例: 308235.9495"></td>
                    <td><input type="number" step="any" class="input-y" placeholder="例: 2764649.9410"></td>
                    <td><button type="button" class="btn-delete">刪除</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="button-group">
        <button type="button" id="addRowBtn" class="btn-secondary">新增一行</button>
        <button type="button" id="calculateBtn" class="btn-primary">開始計算導線</button>
    </div>
</div>

<!-- 必須使用 script 標籤包住 JavaScript 程式碼 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const coordTable = document.getElementById('coordTable');
    const tbody = coordTable.querySelector('tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const calculateBtn = document.getElementById('calculateBtn');

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            const indexCell = row.querySelector('.row-index');
            if (indexCell) {
                indexCell.textContent = index + 1;
            }
        });
    }

    function addRow(id = '', x = '', y = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: GU04"></td>
            <td><input type="number" step="any" class="input-x" value="${x}" placeholder="例: 308235.9495"></td>
            <td><input type="number" step="any" class="input-y" value="${y}" placeholder="例: 2764649.9410"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;
        
        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            deleteRow(this);
        });

        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        if (tbody.rows.length > 1) {
            row.remove();
            updateRowIndices();
        } else {
            row.querySelector('.input-id').value = '';
            row.querySelector('.input-x').value = '';
            row.querySelector('.input-y').value = '';
        }
    }

    const initialDeleteBtn = tbody.querySelector('.btn-delete');
    if (initialDeleteBtn) {
        initialDeleteBtn.addEventListener('click', function() {
            deleteRow(this);
        });
    }

    addRowBtn.addEventListener('click', function() {
        addRow();
    });

    coordTable.addEventListener('paste', function(e) {
        e.preventDefault();
        const clipboardData = e.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData('Text');
        
        const lines = pastedData.split(/\r\n|\n/);
        let currentRow = e.target.closest('tr');
        
        lines.forEach((line) => {
            if (!line.trim()) return;
            const cols = line.trim().split(/\s+/);
            if (cols.length >= 3) {
                const id = cols[0];
                const x = cols[1];
                const y = cols[2];

                if (currentRow) {
                    currentRow.querySelector('.input-id').value = id;
                    currentRow.querySelector('.input-x').value = x;
                    currentRow.querySelector('.input-y').value = y;
                    currentRow = currentRow.nextElementSibling;
                } else {
                    addRow(id, x, y);
                }
            }
        });
    });

    calculateBtn.addEventListener('click', function() {
        const rows = tbody.querySelectorAll('tr');
        const coordinates = [];

        rows.forEach(row => {
            const id = row.querySelector('.input-id').value.trim();
            const x = row.querySelector('.input-x').value.trim();
            const y = row.querySelector('.input-y').value.trim();

            if (id !== '' || x !== '' || y !== '') {
                coordinates.push({ id, x: parseFloat(x), y: parseFloat(y) });
            }
        });

        if (coordinates.length === 0) {
            alert('請至少輸入一筆有效的座標資料！');
            return;
        }

        console.log('收集到的座標資料：', coordinates);
        alert(`成功收集 ${coordinates.length} 筆座標！`);
    });
});
</script>

</body>
</html>
