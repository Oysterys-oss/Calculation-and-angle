<script>
document.addEventListener('DOMContentLoaded', function() {
    const coordTable = document.getElementById('coordTable');
    const tbody = coordTable.querySelector('tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultArea = document.getElementById('resultArea');

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            const indexCell = row.querySelector('.row-index');
            if (indexCell) {
                indexCell.textContent = index + 1;
            }
        });
    }

    function addRow(id = '', x = '', y = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: GU04"></td>
            <td><input type="number" step="any" class="input-x" value="${x}" placeholder="例: X座標"></td>
            <td><input type="number" step="any" class="input-y" value="${y}" placeholder="例: Y座標"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;
        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            deleteRow(this);
        });
        tbody.appendChild(newRow);
        updateRowIndices();
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        if (tbody.rows.length > 1) {
            row.remove();
            updateRowIndices();
        } else {
            row.querySelector('.input-id').value = '';
            row.querySelector('.input-x').value = '';
            row.querySelector('.input-y').value = '';
        }
    }

    tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', function() {
            deleteRow(this);
        });
    });

    addRowBtn.addEventListener('click', function() {
        addRow();
    });

    // 支援 Excel 貼上
    coordTable.addEventListener('paste', function(e) {
        const clipboardData = e.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData('Text');
        if (!pastedData) return;
        e.preventDefault();

        const lines = pastedData.split(/\r\n|\n/);
        let currentRow = e.target.closest('tr');
        if (!currentRow) {
            currentRow = tbody.querySelector('tr');
        }

        lines.forEach((line) => {
            if (!line.trim()) return;
            const cols = line.trim().split(/\s+/);
            if (cols.length >= 3) {
                const id = cols[0];
                const x = cols[1];
                const y = cols[2];

                if (currentRow) {
                    currentRow.querySelector('.input-id').value = id;
                    currentRow.querySelector('.input-x').value = x;
                    currentRow.querySelector('.input-y').value = y;
                    currentRow = currentRow.nextElementSibling;
                } else {
                    addRow(id, x, y);
                }
            }
        });
        updateRowIndices();
    });

    // 點擊計算導線（採用測量學方位角公式：以北向為0度順時針）
    calculateBtn.addEventListener('click', function() {
        const rows = tbody.querySelectorAll('tr');
        const coordinates = [];

        rows.forEach((row, idx) => {
            const idInput = row.querySelector('.input-id');
            const xInput = row.querySelector('.input-x');
            const yInput = row.querySelector('.input-y');

            if (idInput && xInput && yInput) {
                const id = idInput.value.trim() || `P${idx + 1}`;
                const x = parseFloat(xInput.value);
                const y = parseFloat(yInput.value);

                if (!isNaN(x) && !isNaN(y)) {
                    coordinates.push({ id, x, y });
                }
            }
        });

        if (coordinates.length < 2) {
            alert('請至少輸入兩筆有效的座標（包含X與Y）才能計算！');
            return;
        }

        let resultText = "=== 導線計算結果 (測量學方位角: 北向0°順時針) ===\n\n";
        
        for (let i = 0; i < coordinates.length - 1; i++) {
            const p1 = coordinates[i];
            const p2 = coordinates[i + 1];

            // 測量坐標差值：ΔX為北向差，ΔY為東向差
            const dx = p2.x - p1.x; // 縱座標差 (北向)
            const dy = p2.y - p1.y; // 橫座標差 (東向)
            
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 測量學方位角計算：以東向差(dy)與北向差(dx)帶入 atan2，並轉為度數
            let angleRad = Math.atan2(dy, dx);
            let angleDeg = angleRad * (180 / Math.PI);
            
            // 統一轉為 0° ~ 360°
            if (angleDeg < 0) {
                angleDeg += 360;
            }

            const deg = Math.floor(angleDeg);
            const minFloat = (angleDeg - deg) * 60;
            const min = Math.floor(minFloat);
            const sec = ((minFloat - min) * 60).toFixed(1);

            resultText += `路段：${p1.id} ➔ ${p2.id}\n`;
            resultText += `  ΔX (北向差): ${dx.toFixed(4)} m | ΔY (東向差): ${dy.toFixed(4)} m\n`;
            resultText += `  距離: ${distance.toFixed(3)} 公尺\n`;
            resultText += `  方位角: ${deg}° ${min}′ ${sec}″ (${angleDeg.toFixed(4)}°)\n\n`;
        }

        resultArea.style.display = 'block';
        resultArea.textContent = resultText;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });
});
</script>
