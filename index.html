<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多點連續測量方位角與距離計算</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .input-section { margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; }
        button:hover { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .note { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>多點連續方位角與距離計算 (A -> B -> C ...)</h2>
    
    <div class="input-section">
        <label><strong>輸入點位座標 (格式：點號, E坐標, N坐標 每行一點)：</strong></label>
        <textarea id="pointsInput" placeholder="例如:
A, 300000, 2500000
B, 300100, 2500100
C, 300250, 2500150
D, 300300, 2500300"></textarea>
        <div class="note">提示：支援 Excel 直接複製貼上（點名、E、N 欄位），中間用逗號或空格隔開皆可。</div>
    </div>

    <button onclick="calculateTraverse()">計算相鄰各段距離與方位角</button>

    <div id="resultArea" style="margin-top: 20px; overflow-x: auto;">
        <table id="resultTable" style="display: none;">
            <thead>
                <tr>
                    <th>起點</th>
                    <th>終點</th>
                    <th>水平距離 (m)</th>
                    <th>方位角 (十進位)</th>
                    <th>方位角 (DMS 度分秒)</th>
                </tr>
            </thead>
            <tbody id="resultBody">
            </tbody>
        </table>
    </div>
</div>

<script>
function degToDMS(deg) {
    let d = Math.floor(deg);
    let mFloat = (deg - d) * 60;
    let m = Math.floor(mFloat);
    let s = ((mFloat - m) * 60).toFixed(2);
    return `${d}° ${m}' ${s}"`;
}

function calculateTraverse() {
    let rawText = document.getElementById('pointsInput').value.trim();
    if (!rawText) {
        alert("請輸入座標資料！");
        return;
    }

    let lines = rawText.split('\n');
    let points = [];

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        
        // 支援逗號或空格分隔
        let parts = line.split(/[,\t\s]+/);
        if (parts.length >= 3) {
            let name = parts[0];
            let e = parseFloat(parts[1]);
            let n = parseFloat(parts[2]);
            if (!isNaN(e) && !isNaN(n)) {
                points.push({ name: name, e: e, n: n });
            }
        }
    }

    if (points.length < 2) {
        alert("至少需要輸入兩個點（例如 A 和 B）才能計算！");
        return;
    }

    let tbody = document.getElementById('resultBody');
    tbody.innerHTML = "";

    // 計算每一段 (A->B, B->C, C->D ...)
    for (let i = 0; i < points.length - 1; i++) {
        let p1 = points[i];
        let p2 = points[i+1];

        let dx = p2.e - p1.e;
        let dy = p2.n - p1.n;

        let distance = Math.sqrt(dx * dx + dy * dy);
        let angleRad = Math.atan2(dx, dy);
        let angleDeg = angleRad * (180 / Math.PI);

        if (angleDeg < 0) {
            angleDeg += 360;
        }

        let row = `<tr>
            <td>${p1.name}</td>
            <td>${p2.name}</td>
            <td>${distance.toFixed(3)}</td>
            <td>${angleDeg.toFixed(4)}°</td>
            <td>${degToDMS(angleDeg)}</td>
        </tr>`;
        tbody.innerHTML += row;
    }

    document.getElementById('resultTable').style.display = 'table';
}
</script>

</body>
</html>
