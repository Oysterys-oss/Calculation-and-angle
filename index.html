<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測量邊長與夾角計算工具</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .batch-paste-box {
            background-color: #f1f5f9;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .batch-paste-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #334155;
        }

        .batch-paste-box textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            background-color: #ffffff;
        }

        .batch-paste-box textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        #resultArea {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>測量邊長與夾角計算工具</h1>

    <div class="batch-paste-box">
        <label for="batchInput">📋 批次輸入區（可直接手動打字或貼上，欄位間用空白或 Tab 分隔）：</label>
        <textarea id="batchInput" placeholder="格式範例：
P01 250000.123 260000.456
P02 250100.789 260100.123"></textarea>
        <button type="button" id="importBtn" class="btn-secondary" style="margin-top: 8px; width: 100%;">將上方文字追加至表格下方</button>
    </div>

    <div class="table-container">
        <table id="coordTable">
            <thead>
                <tr>
                    <th style="width: 10%;">項次</th>
                    <th style="width: 25%;">點號 (ID)</th>
                    <th style="width: 30%;">X 座標 (北向)</th>
                    <th style="width: 30%;">Y 座標 (東向)</th>
                    <th style="width: 15%;">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="row-index">1</td>
                    <td><input type="text" class="input-id" placeholder="例: P01"></td>
                    <td><input type="number" step="any" class="input-x" placeholder="X座標"></td>
                    <td><input type="number" step="any" class="input-y" placeholder="Y座標"></td>
                    <td><button type="button" class="btn-delete">刪除</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="btn-group">
        <button type="button" id="addRowBtn" class="btn-secondary">＋ 新增導線點</button>
        <button type="button" id="calculateBtn" class="btn-primary">計算邊長與夾角</button>
    </div>

    <div id="resultArea"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tbody = document.querySelector('#coordTable tbody');
    const addRowBtn = document.getElementById('addRowBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultArea = document.getElementById('resultArea');
    const batchInput = document.getElementById('batchInput');
    const importBtn = document.getElementById('importBtn');

    function updateRowIndices() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, index) => {
            const indexCell = row.querySelector('.row-index');
            if (indexCell) {
                indexCell.textContent = index + 1;
            }
        });
    }

    function addRow(id = '', x = '', y = '') {
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td class="row-index"></td>
            <td><input type="text" class="input-id" value="${id}" placeholder="例: P01"></td>
            <td><input type="number" step="any" class="input-x" value="${x}" placeholder="X座標"></td>
            <td><input type="number" step="any" class="input-y" value="${y}" placeholder="Y座標"></td>
            <td><button type="button" class="btn-delete">刪除</button></td>
        `;
        newRow.querySelector('.btn-delete').addEventListener('click', function() {
            deleteRow(this);
        });
        tbody.appendChild(newRow);
        updateRowIndices();
        return newRow;
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        if (tbody.rows.length > 1) {
            row.remove();
            updateRowIndices();
        } else {
            row.querySelector('.input-id').value = '';
            row.querySelector('.input-x').value = '';
            row.querySelector('.input-y').value = '';
        }
    }

    tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', function() {
            deleteRow(this);
        });
    });

    addRowBtn.addEventListener('click', function() {
        addRow();
    });

    importBtn.addEventListener('click', function() {
        const text = batchInput.value.trim();
        if (!text) {
            alert('請先在上方輸入框手動打字或貼上資料！');
            return;
        }

        const lines = text.split(/\r\n|\n/);
        let importedCount = 0;

        lines.forEach((line) => {
            if (!line.trim()) return;
            // 改用正則表達式，支援任意空白字元（包含空格、多個空格、或 Tab）來切分欄位
            const cols = line.trim().split(/\s+/);
            
            if (cols.length >= 3) {
                const id = cols[0].trim();
                const x = cols[1].trim();
                const y = cols[2].trim();

                const firstRow = tbody.querySelector('tr');
                const firstId = firstRow.querySelector('.input-id').value.trim();
                const firstX = firstRow.querySelector('.input-x').value.trim();
                const firstY = firstRow.querySelector('.input-y').value.trim();

                if (!firstId && !firstX && !firstY && importedCount === 0) {
                    firstRow.querySelector('.input-id').value = id;
                    firstRow.querySelector('.input-x').value = x;
                    firstRow.querySelector('.input-y').value = y;
                } else {
                    addRow(id, x, y);
                }
                importedCount++;
            }
        });

        if (importedCount > 0) {
            updateRowIndices();
            alert(`成功追加匯入 ${importedCount} 筆座標資料！`);
            batchInput.value = '';
        } else {
            alert('格式有誤！每行請包含：點號、X座標、Y座標（欄位之間請用空格或 Tab 隔開）。');
        }
    });

    function formatDMS(angleDeg) {
        if (angleDeg < 0) angleDeg += 360;
        if (angleDeg >= 360) angleDeg %= 360;

        const deg = Math.floor(angleDeg);
        const minFloat = (angleDeg - deg) * 60;
        const min = Math.floor(minFloat);
        const sec = ((minFloat - min) * 60).toFixed(1);
        return `${deg}° ${min}′ ${sec}″`;
    }

    calculateBtn.addEventListener('click', function() {
        const rows = tbody.querySelectorAll('tr');
        const coordinates = [];

        rows.forEach((row, idx) => {
            const idInput = row.querySelector('.input-id');
            const xInput = row.querySelector('.input-x');
            const yInput = row.querySelector('.input-y');

            if (idInput && xInput && yInput) {
                const id = idInput.value.trim() || `P${idx + 1}`;
                const x = parseFloat(xInput.value);
                const y = parseFloat(yInput.value);

                if (!isNaN(x) && !isNaN(y)) {
                    coordinates.push({ id, x, y });
                }
            }
        });

        if (coordinates.length < 2) {
            alert('請至少輸入兩筆有效的座標（包含X與Y）才能計算！');
            return;
        }

        let azList = [];
        let resultText = "=== 導線邊長計算 ===\n\n";
        
        for (let i = 0; i < coordinates.length - 1; i++) {
            const p1 = coordinates[i];
            const p2 = coordinates[i + 1];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            let angleRad = Math.atan2(dy, dx);
            let angleDeg = angleRad * (180 / Math.PI);
            if (angleDeg < 0) angleDeg += 360;

            azList.push({
                from: p1.id,
                to: p2.id,
                azimuth: angleDeg,
                distance: distance
            });

            resultText += `邊長：${p1.id} ➔ ${p2.id} = ${distance.toFixed(3)} 公尺\n`;
        }

        if (azList.length >= 2) {
            resultText += "\n=== 頂點夾角 (右角) 計算 ===\n\n";
            for (let i = 0; i < azList.length - 1; i++) {
                const prevAz = azList[i].azimuth;     
                const nextAz = azList[i + 1].azimuth; 
                const vertexPoint = azList[i].to;     

                let backAz = prevAz + 180;
                if (backAz >= 360) backAz -= 360;

                let rightAngle = nextAz - backAz;
                if (rightAngle < 0) rightAngle += 360;

                resultText += `頂點 ${vertexPoint} 夾角：${formatDMS(rightAngle)}\n`;
            }
        }

        resultArea.style.display = 'block';
        resultArea.textContent = resultText;
        resultArea.scrollIntoView({ behavior: 'smooth' });
    });
});
</script>

</body>
</html>
